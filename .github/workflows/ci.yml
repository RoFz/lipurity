name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # NOTE: Action refs are pinned to full commit SHAs for supply-chain security.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The runner's preinstalled Node.js is sufficient; no setup action needed.
      - name: Install dev dependencies
        run: npm ci

      - name: Syntax check
        run: node --check lipurity.user.js

      - name: ESLint (incl. userscript metadata validation)
        run: npx eslint .
